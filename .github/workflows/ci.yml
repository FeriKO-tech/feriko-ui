name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Typecheck @feriko/ui
        run: pnpm --filter @feriko/ui exec tsc --noEmit --pretty false

      - name: Typecheck feriko-ui CLI
        run: pnpm --filter feriko-ui exec tsc --noEmit --pretty false

      - name: Typecheck @feriko/docs
        run: pnpm --filter @feriko/docs exec tsc --noEmit --pretty false

      - name: Typecheck storybook
        run: pnpm --filter storybook exec tsc --noEmit --pretty false

      - name: Build Storybook
        run: pnpm build:storybook
